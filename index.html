<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MountOlive Admin Dashboard</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; margin: 0; background: #1f8f4e; color: #b88a4a; }

header {
  background: #1f8f4e;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #b88a4a;
}

.logo { height: 45px; }

.container { padding: 15px; }

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  color: #6b4226;
}

input, button {
  padding: 10px;
  margin: 5px 0;
  border-radius: 5px;
  width: 100%;
  box-sizing: border-box;
}

button {
  background: #b88a4a;
  color: white;
  border: none;
  cursor: pointer;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
}

.hidden { display: none; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="card" style="max-width:300px;margin:100px auto;text-align:center;">
  <img src="MountOlive Logo.jpg" width="120">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="MountOlive Logo.jpg" class="logo">
    <h2>MountOlive Admin</h2>
  </div>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="card">
  <h3>Add Stock</h3>
  <input id="itemName" placeholder="Name">
  <input id="itemRef" placeholder="Ref Nr">
  <input id="itemSupplier" placeholder="Supplier">
  <input id="itemSize" placeholder="Size">
  <input id="qtyStock" type="number" placeholder="Qty Stock Available">
  <button onclick="addStock()">Add</button>
</div>

<div class="card">
  <h3>Import / Export</h3>
  <input type="file" id="fileInput">

  <button onclick="previewExcel()">Preview Excel</button>
  <button onclick="saveExcelToDB()">Save To Database</button> 
  <button onclick="exportExcel()">Export Excel</button>
  <button onclick="exportMonthlyHistory()">Export Monthly History</button>
</div>

<div class="card">
  <h3>Search Stock</h3>
  <input type="text" id="searchBox" placeholder="Search..." onkeyup="filterStock()">
  <button onclick="resetSearch()">Reset Search</button>
</div>

<div class="card">
  <h3>Stock List</h3>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Ref</th>
        <th>Supplier</th>
        <th>Available</th>
        <th>Order</th>
        <th>Info</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="stockTable"></tbody>
  </table>
</div>

<div class="card">
  <h3>Stock History</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Before</th>
        <th>Ordered</th>
        <th>After</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="historyTable"></tbody>
  </table>
</div>

</div>
</div>

<script>
const { createClient } = supabase;

const db = createClient(
  "https://gktzuqstxyxugrvfyahe.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdHp1cXN0eHl4dWdydmZ5YWhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2Njk4NjgsImV4cCI6MjA5MTI0NTg2OH0.2yNTKezSwCu3K0IFod-oLiXK-behvsOObEhY9vWeBRM"
);

let stockData = [];
let excelPreviewData = [];

/* ---------------- PWA INSTALL ---------------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}

/* ---------------- LOAD SAVED EXCEL ---------------- */
window.addEventListener("load", () => {
  const saved = localStorage.getItem("excelPreviewData");
  if (saved) {
    excelPreviewData = JSON.parse(saved);
    if (excelPreviewData.length > 0) {
      renderExcelPreview(excelPreviewData);
    }
  }
});

/* ---------------- SAVE TO STORAGE ---------------- */
function savePreviewToStorage() {
  localStorage.setItem("excelPreviewData", JSON.stringify(excelPreviewData));
}

/* ---------------- LOGIN ---------------- */
async function login() {
  const { error } = await db.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if (error) return alert(error.message);

  loginPage.classList.add("hidden");
  dashboard.classList.remove("hidden");

  loadStock();
  loadHistory();
}

/* ---------------- LOGOUT ---------------- */
async function logout() {
  await db.auth.signOut();
  location.reload();
}

/* ---------------- STOCK ---------------- */
async function loadStock() {
  const { data } = await db.from("stocks").select("*");
  stockData = data || [];
  renderStock(stockData);
}

/* ---------------- HISTORY ---------------- */
async function loadHistory() {
  const { data } = await db.from("stock_history").select("*").order("created_at", { ascending: false });

  historyTable.innerHTML = "";

  (data || []).forEach(h => {
    historyTable.innerHTML += `
      <tr>
        <td>${h.name}</td>
        <td>${h.qty_before}</td>
        <td>${h.qty_ordered}</td>
        <td>${h.qty_after}</td>
        <td>${new Date(h.created_at).toLocaleString()}</td>
      </tr>
    `;
  });
}

/* ---------------- EXCEL PREVIEW ---------------- */
function previewExcel() {
  const file = fileInput.files[0];
  if (!file) return alert("Select Excel file");

  const reader = new FileReader();

  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data, { type: "array" });

    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);

    excelPreviewData = rows;
    savePreviewToStorage();   // ✅ SAVE HERE
    renderExcelPreview(rows);
  };

  reader.readAsArrayBuffer(file);
}

/* ---------------- RENDER PREVIEW ---------------- */
function renderExcelPreview(rows) {
  stockTable.innerHTML = "";

  rows.forEach((r, i) => {

    stockTable.innerHTML += `
      <tr>
        <td><input id="ex_name_${i}" value="${r.Name || r['Item Name'] || ""}"></td>
        <td><input id="ex_ref_${i}" value="${r.Ref || r.Reference || ""}"></td>
        <td><input id="ex_supplier_${i}" value="${r.Supplier || ""}"></td>
        <td><input id="ex_available_${i}" value="${r.Available || 0}" type="number"></td>

        <td>—</td>
        <td>Preview</td>

        <td>
            <button onclick="updateExcelRow(${i})">Update</button>
            <button onclick="removeExcelRow(${i})">Remove</button>
        </td>
      </tr>
    `;
  });
}

/* ---------------- REMOVE ROW ---------------- */
function removeExcelRow(i) {
  excelPreviewData.splice(i, 1);
  savePreviewToStorage(); // ✅ SAVE
  renderExcelPreview(excelPreviewData);
}

/* ---------------- UPDATE ROW ---------------- */
async function updateStock(id) {

  const name = document.getElementById("n"+id).value;
  const ref = document.getElementById("r"+id).value;
  const supplier = document.getElementById("s"+id).value;

  const availableInput = parseInt(document.getElementById("a"+id).value) || 0;
  const orderQty = parseInt(document.getElementById("o"+id).value) || 0;

  // Get current stock from DB
  const { data: existing, error } = await db
    .from("stocks")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !existing) {
    return alert("Stock not found");
  }

  let qtyBefore = existing.qty_stock_available;
  let qtyAfter = qtyBefore;

  // 🔥 APPLY ORDER LOGIC
  if (orderQty > 0) {

    if (orderQty > qtyBefore) {
      return alert("Order cannot be more than available stock!");
    }

    qtyAfter = qtyBefore - orderQty;

    // SAVE HISTORY
    await db.from("stock_history").insert([{
      stock_id: id,
      name: existing.name,
      qty_before: qtyBefore,
      qty_ordered: orderQty,
      qty_after: qtyAfter
    }]);

  } else {
    // If no order, just manual update
    qtyAfter = availableInput;
  }

  // UPDATE STOCK
  await db.from("stocks").update({
    name,
    ref,
    supplier,
    qty_stock_available: qtyAfter,
    last_ordered: orderQty
  }).eq("id", id);

  alert("Stock updated ✅");

  // Reload data
  loadStock();
  loadHistory();
}
/* ---------------- SAVE ALL ---------------- */
async function saveExcelToDB() {

  for (let i = 0; i < excelPreviewData.length; i++) {

    const name = document.getElementById("ex_name_"+i).value;
    const ref = document.getElementById("ex_ref_"+i).value;
    const supplier = document.getElementById("ex_supplier_"+i).value;
    const available = parseInt(document.getElementById("ex_available_"+i).value) || 0;

    const { data: existing } = await db
      .from("stocks")
      .select("*")
      .eq("ref", ref)
      .single();

    if (existing) {
      await db.from("stocks").update({
        name,
        supplier,
        qty_stock_available: available
      }).eq("id", existing.id);

    } else {
      await db.from("stocks").insert([{
        name,
        ref,
        supplier,
        qty_stock_available: available
      }]);
    }
  }

  alert("Saved ✅");

  excelPreviewData = [];
  localStorage.removeItem("excelPreviewData"); // clear saved
  loadStock();
  loadHistory();
}
</script>

</body>
</html>
