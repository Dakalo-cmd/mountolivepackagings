<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MountOlive Admin Dashboard</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; margin: 0; background: #1f8f4e; color: #b88a4a; }
header {
  background: #1f8f4e;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #b88a4a;
}
.logo { height: 45px; }
.container { padding: 15px; }
.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  color: #6b4226;
}
input, button {
  padding: 10px;
  margin: 5px 0;
  border-radius: 5px;
  width: 100%;
}
button {
  background: #b88a4a;
  color: white;
  border: none;
  cursor: pointer;
}
table { width: 100%; border-collapse: collapse; }
th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
}
.hidden { display: none; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="card" style="max-width:300px;margin:100px auto;text-align:center;">
  <img src="MountOlive Logo.jpg" width="120">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="MountOlive Logo.jpg" class="logo">
    <h2>MountOlive Admin</h2>
  </div>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="card">
  <h3>Stock List</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Ref</th>
        <th>Supplier</th>
        <th>Available</th>
        <th>Order</th>
        <th>Info</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="stockTable"></tbody>
  </table>
</div>

<div class="card">
  <h3>Stock History</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Before</th>
        <th>Ordered</th>
        <th>After</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="historyTable"></tbody>
  </table>
</div>

</div>
</div>

<script>
const { createClient } = supabase;

const db = createClient(
  "https://gktzuqstxyxugrvfyahe.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdHp1cXN0eHl4dWdydmZ5YWhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2Njk4NjgsImV4cCI6MjA5MTI0NTg2OH0.2yNTKezSwCu3K0IFod-oLiXK-behvsOObEhY9vWeBRM"
);

/* LOGIN */
async function login() {
  const { error } = await db.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if (error) return alert(error.message);

  loginPage.classList.add("hidden");
  dashboard.classList.remove("hidden");

  loadStock();
  loadHistory();
}

/* LOGOUT */
async function logout() {
  await db.auth.signOut();
  location.reload();
}

/* LOAD STOCK */
async function loadStock() {
  const { data } = await db.from("stocks").select("*");
  renderStock(data || []);
}

/* LOAD HISTORY */
async function loadHistory() {
  const { data } = await db.from("stock_history").select("*").order("created_at", { ascending: false });

  historyTable.innerHTML = "";

  (data || []).forEach(h => {
    historyTable.innerHTML += `
      <tr>
        <td>${h.name}</td>
        <td>${h.qty_before}</td>
        <td>${h.qty_ordered}</td>
        <td>${h.qty_after}</td>
        <td>${new Date(h.created_at).toLocaleString()}</td>
      </tr>
    `;
  });
}

/* RENDER STOCK */
function renderStock(data) {
  stockTable.innerHTML = "";

  data.forEach(item => {

    const info = item.last_ordered > 0
      ? `${item.qty_stock_available + item.last_ordered} → ${item.last_ordered} ordered → ${item.qty_stock_available}`
      : "No order";

    stockTable.innerHTML += `
      <tr>
        <td><input id="n${item.id}" value="${item.name}"></td>
        <td><input id="r${item.id}" value="${item.ref}"></td>
        <td><input id="s${item.id}" value="${item.supplier || ""}"></td>

        <td><input id="a${item.id}" value="${item.qty_stock_available}" type="number"></td>
        <td><input id="o${item.id}" value="0" type="number"></td>

        <td>${info}</td>

        <td>
          <button onclick="updateStock('${item.id}')">Update</button>
        </td>
      </tr>
    `;
  });
}

/* UPDATE STOCK (MAIN LOGIC) */
async function updateStock(id) {

  const name = document.getElementById("n"+id).value;
  const ref = document.getElementById("r"+id).value;
  const supplier = document.getElementById("s"+id).value;

  const availableInput = parseInt(document.getElementById("a"+id).value) || 0;
  const orderQty = parseInt(document.getElementById("o"+id).value) || 0;

  const { data: existing } = await db
    .from("stocks")
    .select("*")
    .eq("id", id)
    .single();

  let qtyBefore = existing.qty_stock_available;
  let qtyAfter = qtyBefore;

  if (orderQty > 0) {

    if (orderQty > qtyBefore) {
      return alert("Order exceeds stock!");
    }

    qtyAfter = qtyBefore - orderQty;

    await db.from("stock_history").insert([{
      stock_id: id,
      name: existing.name,
      qty_before: qtyBefore,
      qty_ordered: orderQty,
      qty_after: qtyAfter
    }]);

  } else {
    qtyBefore = availableInput;
    qtyAfter = availableInput;
  }

  await db.from("stocks").update({
    name,
    ref,
    supplier,
    qty_stock_available: qtyAfter,
    last_ordered: orderQty
  }).eq("id", id);

  // reset order field
  document.getElementById("o"+id).value = 0;

  alert("Updated ✅");

  loadStock();
  loadHistory();
}
</script>

</body>
</html>
