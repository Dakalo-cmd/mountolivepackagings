<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MountOlive Admin Dashboard</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; margin: 0; background: #1f8f4e; color: #b88a4a; }
header { background: #1f8f4e; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #b88a4a; }
.logo { height: 45px; }
.container { padding: 15px; }
.card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; color: #6b4226; }
input, button { padding: 10px; margin: 5px 0; border-radius: 5px; width: 100%; box-sizing: border-box; }
button { background: #b88a4a; color: white; border: none; cursor: pointer; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
.hidden { display: none; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="card" style="max-width:300px;margin:100px auto;text-align:center;">
  <img src="MountOlive Logo.jpg" width="120">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="MountOlive Logo.jpg" class="logo">
    <h2>MountOlive Admin</h2>
  </div>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="card">
  <h3>Add Stock</h3>
  <input id="itemName" placeholder="Name">
  <input id="itemRef" placeholder="Ref Nr">
  <input id="itemSupplier" placeholder="Supplier">
  <input id="itemSize" placeholder="Size">
  <input id="qtyStock" type="number" placeholder="Qty Stock Available">
  <button onclick="addStock()">Add</button>
</div>

<div class="card">
  <h3>Import / Export</h3>
  <input type="file" id="fileInput">
  <button onclick="previewExcel()">Preview Excel</button>
  <button onclick="saveExcelToDB()">Save To Database</button> 
  <button onclick="exportExcel()">Export Excel</button>
  <button onclick="exportMonthlyHistory()">Export Monthly History</button>
</div>

<div class="card">
  <h3>Search Stock</h3>
  <input type="text" id="searchBox" placeholder="Search..." onkeyup="filterStock()">
  <button onclick="resetSearch()">Reset Search</button>
</div>

<div class="card">
  <h3>Stock List</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Ref</th>
        <th>Supplier</th>
        <th>Available</th>
        <th>Order</th>
        <th>Size</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="stockTable"></tbody>
  </table>
</div>

<div class="card">
  <h3>Stock History</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Before</th>
        <th>Ordered</th>
        <th>After</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="historyTable"></tbody>
  </table>
</div>

</div>
</div>

<script>
const { createClient } = supabase;

const db = createClient(
  "https://gktzuqstxyxugrvfyahe.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdHp1cXN0eHl4dWdydmZ5YWhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2Njk4NjgsImV4cCI6MjA5MTI0NTg2OH0.2yNTKezSwCu3K0IFod-oLiXK-behvsOObEhY9vWeBRM"
);

let stockData = [];
let excelPreviewData = [];

const searchBox = document.getElementById("searchBox");
const stockTable = document.getElementById("stockTable");
const historyTable = document.getElementById("historyTable");

/* LOGIN */
async function login() {
  const { error } = await db.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if (error) return alert(error.message);

  loginPage.classList.add("hidden");
  dashboard.classList.remove("hidden");

  loadStock();
  loadHistory();
}

/* LOGOUT */
async function logout() {
  await db.auth.signOut();
  location.reload();
}

/* ADD STOCK */
async function addStock() {

  const name = itemName.value.trim();
  const ref = itemRef.value.trim();
  const supplier = itemSupplier.value.trim();
  const size = itemSize.value.trim();
  const qty = parseInt(qtyStock.value);

  if (!name || !ref || !supplier || !size || isNaN(qty) || qty <= 0) {
    return alert("⚠️ Fill ALL fields correctly");
  }

  const { data, error } = await db.from("stocks").insert([{
    name,
    ref,
    supplier,
    size,
    qty_stock_available: qty
  }]).select();

  if (error) return alert(error.message);

  const newStock = data[0];

  await db.from("stock_history").insert([{
    stock_id: newStock.id,
    name,
    qty_before: 0,
    qty_ordered: 0,
    qty_after: qty
  }]);

  loadStock();
  loadHistory();
}

/* LOAD STOCK */
async function loadStock() {

  // 🔥 RESTORE EXCEL PREVIEW IF EXISTS
  const saved = localStorage.getItem("excelPreview");

  if (saved) {
    excelPreviewData = JSON.parse(saved);
    renderExcelPreview(excelPreviewData);
    return;
  }

  const { data } = await db.from("stocks").select("*");
  stockData = data || [];
  renderStock(stockData);
}

/* NORMAL STOCK */
function renderStock(data) {
  stockTable.innerHTML = "";

  data.forEach(item => {
    stockTable.innerHTML += `
      <tr>
        <td><input id="n${item.id}" value="${item.name || ""}"></td>
        <td><input id="r${item.id}" value="${item.ref || ""}"></td>
        <td><input id="s${item.id}" value="${item.supplier || ""}"></td>
        <td><input id="a${item.id}" type="number" value="${item.qty_stock_available || 0}"></td>
        <td><input id="o${item.id}" type="number" value="0"></td>
        <td><input id="z${item.id}" value="${item.size || ""}"></td>
        <td>
          <button onclick="updateStock('${item.id}')">Update</button>
          <button onclick="deleteStock('${item.id}')" style="background:red;margin-top:5px;">Delete</button>
        </td>
      </tr>
    `;
  });
}

/* DELETE */
async function deleteStock(id) {
  await db.from("stocks").delete().eq("id", id);
  loadStock();
}

/* UPDATE STOCK */
async function updateStock(id) {

  const name = document.getElementById("n"+id).value.trim();
  const ref = document.getElementById("r"+id).value.trim();
  const supplier = document.getElementById("s"+id).value.trim();
  const size = document.getElementById("z"+id).value.trim();

  const available = parseInt(document.getElementById("a"+id).value) || 0;
  const order = parseInt(document.getElementById("o"+id).value) || 0;

  const { data: existing } = await db.from("stocks").select("*").eq("id", id).single();

  let qtyAfter = available;

  if (order > 0) {
    if (order > existing.qty_stock_available) return alert("Order too high");

    qtyAfter = existing.qty_stock_available - order;

    await db.from("stock_history").insert([{
      stock_id: id,
      name,
      qty_before: existing.qty_stock_available,
      qty_ordered: order,
      qty_after: qtyAfter
    }]);
  }

  await db.from("stocks").update({
    name, ref, supplier, size,
    qty_stock_available: qtyAfter
  }).eq("id", id);

  loadStock();
  loadHistory();
}

/* HISTORY */
async function loadHistory() {
  const { data } = await db.from("stock_history").select("*").order("created_at", { ascending: false });

  historyTable.innerHTML = "";

  (data || []).forEach(h => {
    historyTable.innerHTML += `
      <tr>
        <td>${h.name}</td>
        <td>${h.qty_before}</td>
        <td>${h.qty_ordered}</td>
        <td>${h.qty_after}</td>
        <td>${new Date(h.created_at).toLocaleString()}</td>
      </tr>
    `;
  });
}

/* SEARCH */
function filterStock() {
  const value = searchBox.value.toLowerCase();
  const rows = document.querySelectorAll("#stockTable tr");

  rows.forEach(row => {
    const inputs = row.querySelectorAll("input");
    const name = inputs[0].value.toLowerCase();
    const ref = inputs[1].value.toLowerCase();
    row.style.display = name.includes(value) || ref.includes(value) ? "" : "none";
  });
}

function resetSearch() {
  searchBox.value = "";
  document.querySelectorAll("#stockTable tr").forEach(r => r.style.display = "");
}

/* EXCEL PREVIEW */
function previewExcel() {

  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Select Excel file");

  const reader = new FileReader();

  reader.onload = function(e) {

    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: "array" });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);

    excelPreviewData = rows;

    // 🔥 SAVE FOR REFRESH
    localStorage.setItem("excelPreview", JSON.stringify(rows));

    renderExcelPreview(rows);
  };

  reader.readAsArrayBuffer(file);
}

/* RENDER EXCEL (WITH ALL BUTTONS BACK) */
function renderExcelPreview(rows) {

  stockTable.innerHTML = "";

  rows.forEach((r, i) => {

    stockTable.innerHTML += `
      <tr>
        <td><input id="ex_name_${i}" value="${r.Name || ""}"></td>
        <td><input id="ex_ref_${i}" value="${r.Ref || ""}"></td>
        <td><input id="ex_supplier_${i}" value="${r.Supplier || ""}"></td>
        <td><input id="ex_available_${i}" type="number" value="${r.Available || 0}"></td>
        <td><input id="ex_order_${i}" type="number" value="0"></td>
        <td><input id="ex_size_${i}" value="${r.Size || ""}"></td>
        <td>
          <button onclick="updatePreviewRow(${i})">Update</button>
          <button onclick="deletePreviewRow(${i})" style="background:red;margin-top:5px;">Delete</button>
        </td>
      </tr>
    `;
  });
}

/* UPDATE PREVIEW (CLEAN + SAVE STOCK + HISTORY ONCE) */
async function updatePreviewRow(i) {

  const available = parseInt(document.getElementById("ex_available_" + i).value) || 0;
  const order = parseInt(document.getElementById("ex_order_" + i).value) || 0;

  if (order > available) return alert("Order too high");

  const newVal = available - order;

  document.getElementById("ex_available_" + i).value = newVal;

  excelPreviewData[i].Available = newVal;
  localStorage.setItem("excelPreview", JSON.stringify(excelPreviewData));

  const name = document.getElementById("ex_name_" + i).value;
  const ref = document.getElementById("ex_ref_" + i).value;

  // get real stock
  const { data: existing } = await db
    .from("stocks")
    .select("*")
    .eq("ref", ref)
    .maybeSingle();

  if (!existing) {
    alert("Stock not found in database");
    return;
  }

  const qty_before = existing.qty_stock_available;

  const finalQty = qty_before - order;

  if (finalQty < 0) {
    return alert("Not enough stock in database");
  }

  // update stock
  await db.from("stocks")
    .update({
      qty_stock_available: finalQty
    })
    .eq("id", existing.id);

  // insert history ONLY ONCE
  await db.from("stock_history").insert([{
    stock_id: existing.id,
    name,
    qty_before,
    qty_ordered: order,
    qty_after: finalQty
  }]);
}
/* DELETE PREVIEW */
function deletePreviewRow(i) {
  excelPreviewData.splice(i, 1);
  localStorage.setItem("excelPreview", JSON.stringify(excelPreviewData));
  renderExcelPreview(excelPreviewData);
}

/* SAVE EXCEL */
async function saveExcelToDB() {

  for (let i = 0; i < excelPreviewData.length; i++) {

    const name = document.getElementById("ex_name_"+i).value;
    const ref = document.getElementById("ex_ref_"+i).value;
    const supplier = document.getElementById("ex_supplier_"+i).value;
    const available = parseInt(document.getElementById("ex_available_"+i).value) || 0;

    if (!name || !ref) continue;

    await db.from("stocks").upsert([{
      name,
      ref,
      supplier,
      size: "",
      qty_stock_available: available
    }], { onConflict: "ref" });
	
await db.from("stock_history").insert([{
  stock_id: null, // or fetch real ID if you want linking
  name,
  qty_before: 0,
  qty_ordered: 0,
  qty_after: available
}]);
  }

  localStorage.removeItem("excelPreview");

  loadStock();
}

/* INIT */
window.onload = () => {
  loadStock();
  loadHistory();
};
</script>

</body>
</html>
