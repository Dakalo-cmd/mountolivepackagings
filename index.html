<style>
/* ===== YOUR CSS UNCHANGED ===== */

*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;}
body{
  font-family:'Poppins',sans-serif;
  background:#f4f7f6;
  overflow-x:hidden;
  overflow-y:auto;
  position:relative;
}

/* PAGE TRANSITIONS */
#loginPage,#dashboard{
  width:100%;height:100vh;
  position:absolute;inset:0;
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(40px) scale(0.98);
  transition:opacity 0.7s ease,transform 0.7s ease,visibility 0.7s ease;
  overflow:hidden;
}

#loginPage.active,#dashboard.active{
  opacity:1;visibility:visible;pointer-events:auto;
  transform:translateY(0) scale(1);
}

.hidden{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(40px) scale(0.98);}

/* LOGIN */
#loginPage{
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.55)),
  url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;background-position:center;
  padding:20px;z-index:2;
}

.login-overlay{position:absolute;inset:0;backdrop-filter:blur(3px);}
.login-container{position:relative;z-index:2;width:100%;max-width:1100px;display:grid;grid-template-columns:1fr 420px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:28px;overflow:hidden;backdrop-filter:blur(15px);box-shadow:0 20px 60px rgba(0,0,0,0.4);animation:fadeUp 1s ease;}
.login-left{padding:70px;color:white;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,rgba(31,143,78,0.9),rgba(20,80,45,0.92));}
.company-badge{display:inline-block;width:max-content;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);padding:8px 18px;border-radius:50px;margin-bottom:25px;font-size:14px;letter-spacing:1px;}
.login-left h1{font-size:55px;line-height:1.1;margin-bottom:20px;font-weight:700;}
.login-left p{font-size:17px;line-height:1.8;color:#f2f2f2;max-width:500px;}

.login-right{background:white;padding:50px 40px;display:flex;flex-direction:column;justify-content:center;}
.logo-wrap{text-align:center;margin-bottom:20px;}
.logo-wrap img{width:120px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.15);}
.login-title{text-align:center;color:#1f8f4e;font-size:34px;margin-bottom:10px;font-weight:700;}
.login-sub{text-align:center;color:#777;margin-bottom:35px;font-size:14px;}

.input-group{margin-bottom:20px;}
.input-group label{display:block;margin-bottom:8px;font-size:14px;font-weight:500;color:#444;}
.input-group input{width:100%;padding:15px;border-radius:12px;border:1px solid #d8d8d8;font-size:15px;}
.login-btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#b88a4a,#8f6733);color:white;font-size:16px;font-weight:600;cursor:pointer;}
.login-footer{text-align:center;color:#777;font-size:13px;margin-top:25px;}

/* DASHBOARD */
#dashboard{background:#f4f7f6;overflow-y:auto;z-index:1;}
header{background:#1f8f4e;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;color:white;border-bottom:4px solid #b88a4a;position:sticky;top:0;z-index:100;}
.logo{height:50px;border-radius:10px;}
.container{padding:20px;}
.card{background:white;padding:20px;margin-bottom:20px;border-radius:18px;overflow-x:auto;box-shadow:0 5px 20px rgba(0,0,0,0.08);}
.card h3{margin-bottom:15px;color:#1f8f4e;}

input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc;font-family:'Poppins',sans-serif;}
button{background:#b88a4a;color:white;border:none;cursor:pointer;font-weight:600;}
table{width:100%;border-collapse:collapse;min-width:850px;}
th,td{border:1px solid #e5e5e5;padding:10px;text-align:center;}
th{background:#f7f7f7;}


/* ===== MOBILE RESPONSIVE FIX ===== */

@media (max-width: 900px){

  /* LOGIN PAGE */
  .login-container{
    grid-template-columns:1fr;

/* EXTRA SMALL PHONES */
@media (max-width: 500px){

  }

    font-size:18px;
  }

  th,td{
    font-size:12px;
  }

}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}

</style>
</head>

 <body>

<div id="loginPage" class="active">
  <div class="login-overlay"></div>

  <div class="login-container">
    <div class="login-left">
      <div class="company-badge">MOUNT OLIVE PACKAGING</div>
      <h1>Smart Stock Management Dashboard</h1>
      <p>Manage inventory, suppliers, stock history and Excel imports.</p>
    </div>

    <div class="login-right">
      <div class="logo-wrap">

      <h2 class="login-title">Admin Login</h2>

      <div class="input-group">

<div id="dashboard" class="hidden">

<header>

<div class="container">

<div class="card">
<h3>Add Stock</h3>
<input id="itemName" placeholder="Name">
<input id="itemRef" placeholder="Ref">
<input id="itemSupplier" placeholder="Supplier">
<input id="itemSize" placeholder="Size">
<input id="qty_stock_available" type="number" placeholder="Qty">
<button onclick="addStock()">Add</button>
</div>

<!-- IMPORT EXPORT -->
<div class="card">

  <h3>Import / Export</h3>

  <input type="file" id="fileInput">

  <button onclick="previewExcel()">Preview Excel</button>
  <button onclick="saveExcelToDB()">Save To Database</button>
  <button onclick="exportExcel()">Export Excel</button>
  <button onclick="exportMonthlyHistory()">Export Monthly History</button>

<div class="card">
  <h3>Search Stock</h3>
  <input
    type="text"
    id="searchBox"

  >
  <button onclick="resetSearch()">Reset Search</button>
</div>

<!-- STOCK TABLE -->
<div class="card">
  <h3>Stock List</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Ref</th>
        <th>Supplier</th>
        <th>Available</th>
        <th>Order</th>
        <th>Size</th>
        <th>Action</th>
      </tr>
    </thead>
  <tbody id="stockTable"></tbody>
  </table>
</div>

<!-- HISTORY -->
<div class="card">
  <h3>Stock History</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Before</th>
        <th>Ordered</th>
        <th>After</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="historyTable"></tbody>
  </table>
</div>


</div>
</div>

<script>

/* ✅ FIX: GLOBAL ELEMENTS (IMPORTANT FIX) */
const loginPage = document.getElementById("loginPage");
const dashboard = document.getElementById("dashboard");

/* SUPABASE */
const { createClient } = supabase;

const db = createClient(
  "https://gktzuqstxyxugrvfyahe.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdHp1cXN0eHl4dWdydmZ5YWhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2Njk4NjgsImV4cCI6MjA5MTI0NTg2OH0.2yNTKezSwCu3K0IFod-oLiXK-behvsOObEhY9vWeBRM"
);

let stockTable = document.getElementById("stockTable");
let searchBox = document.getElementById("searchBox");
let stockData = [];
let excelPreviewData = [];

/* LOGIN */
async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({
    email,

}

/* LOGOUT */
async function logout() {
  await db.auth.signOut();

  dashboard.classList.remove("active");

  setTimeout(() => {
    dashboard.classList.add("hidden");
    loginPage.classList.remove("hidden");
    loginPage.classList.add("active");
  }, 500);
}

/* STOCK FUNCTIONS (kept simple fix only) */
async function addStock() {

  const name = itemName.value.trim();
  const ref = itemRef.value.trim();
  const supplier = itemSupplier.value.trim();
  const size = itemSize.value.trim();
  const qty = parseInt(qtyStock.value);

  if (!name || !ref || !supplier || !size || isNaN(qty) || qty <= 0) {
    return alert("⚠️ Fill ALL fields correctly");
  }

  const { data, error } = await db.from("stocks").insert([{
    name,
    ref,
    supplier,
    size,
    qty_stock_available: qty
  }]).select();

  if (error) return alert(error.message);

  const newStock = data[0];

  await db.from("stock_history").insert([{
    stock_id: newStock.id,
    name,
    qty_before: 0,
    qty_ordered: 0,
    qty_after: qty
  }]);

  loadStock();

}

/* LOAD STOCK */
async function loadStock() {

  const { data } = await db.from("stocks").select("*");

  stockData = data || [];

  renderStock(stockData);
}

/* NORMAL STOCK */
function renderStock(data) {

  stockTable.innerHTML = "";

  data.forEach(item => {

    stockTable.innerHTML += `
      <tr>

        <td>
          <input id="n${item.id}" value="${item.name || ""}">
        </td>

        <td>
          <input id="r${item.id}" value="${item.ref || ""}">
        </td>

        <td>
          <input id="s${item.id}" value="${item.supplier || ""}">
        </td>

        <td>
          <input
            id="a${item.id}"
            type="number"
            value="${item.qty_stock_available || 0}"
          >
        </td>

        <td>
          <input
            id="o${item.id}"
            type="number"
            value="0"
          >
        </td>

        <td>
          <input id="z${item.id}" value="${item.size || ""}">
        </td>

        <td>

          <button onclick="updateStock('${item.id}')">
            Update
          </button>

          <button
            onclick="deleteStock('${item.id}')"
            style="background:red;margin-top:5px;"
          >
            Delete
          </button>

        </td>

      </tr>
    `;
  });
}

/* DELETE */
async function deleteStock(id) {

  await db.from("stocks").delete().eq("id", id);

  loadStock();
}

/* UPDATE STOCK */
async function updateStock(id) {

  const name = document.getElementById("n"+id).value.trim();
  const ref = document.getElementById("r"+id).value.trim();
  const supplier = document.getElementById("s"+id).value.trim();
  const size = document.getElementById("z"+id).value.trim();

  const available = parseInt(document.getElementById("a"+id).value) || 0;
  const order = parseInt(document.getElementById("o"+id).value) || 0;

  const { data: existing } = await db
    .from("stocks")
    .select("*")
    .eq("id", id)
    .single();

  let qtyAfter = available;

  if (order > 0) {

    if (order > existing.qty_stock_available) {
      return alert("Order too high");
    }

    qtyAfter = existing.qty_stock_available - order;

    await db.from("stock_history").insert([{
      stock_id: id,
      name,
      qty_before: existing.qty_stock_available,
      qty_ordered: order,
      qty_after: qtyAfter
    }]);
  }

  await db.from("stocks").update({
    name,
    ref,
    supplier,
    size,
    qty_stock_available: qtyAfter
  }).eq("id", id);

  loadStock();
  loadHistory();
}

<!-- REPLACE ONLY THIS FUNCTION -->

/* HISTORY */
async function loadHistory() {

  const historyTable = document.getElementById("historyTable");

  const { data, error } = await db
    .from("stock_history")
    .select("*")
    .order("created_at", { ascending: false });

  if(error){
    console.log(error);
    return;
  }

  historyTable.innerHTML = "";

  if(!data || data.length === 0){

    historyTable.innerHTML = `
      <tr>
        <td colspan="5">No history found</td>
      </tr>
    `;
    return;
  }
  data.forEach(h => {
    historyTable.innerHTML += `
      <tr>
        <td>${h.name || ""}</td>
        <td>${h.qty_before ?? 0}</td>
        <td>${h.qty_ordered ?? 0}</td>
        <td>${h.qty_after ?? 0}</td>
        <td>
          ${
            h.created_at
            ? new Date(h.created_at).toLocaleString()
            : ""
          }
        </td>
      </tr>
    `;
  });
}

/* SEARCH */
function filterStock() {

  const value = searchBox.value.toLowerCase();

  const rows = document.querySelectorAll("#stockTable tr");

  rows.forEach(row => {

    const inputs = row.querySelectorAll("input");

    const name = inputs[0].value.toLowerCase();
    const ref = inputs[1].value.toLowerCase();

    row.style.display =
      name.includes(value) || ref.includes(value)
      ? ""
      : "none";
  });
}

/* RESET SEARCH */
function resetSearch() {

  searchBox.value = "";

  document.querySelectorAll("#stockTable tr")
    .forEach(r => r.style.display = "");
}

/* EXCEL PREVIEW */
async function previewExcel() {

  const file = document.getElementById("fileInput").files[0];

  if (!file) return alert("Select Excel file");

  const reader = new FileReader();

  reader.onload = async function(e) {

    const data = new Uint8Array(e.target.result);

    const workbook = XLSX.read(data, { type: "array" });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];

    const rows = XLSX.utils.sheet_to_json(sheet);

    excelPreviewData = rows;

    renderExcelPreview(rows);

    // SAVE TO DATABASE FOR ALL DEVICES
    for (const r of rows) {

      await db.from("stocks").upsert([{
        name: r.Name || "",
        ref: r.Ref || "",
        supplier: r.Supplier || "",
        size: r.Size || "",
        qty_stock_available: parseInt(r.Available) || 0
      }], {
        onConflict: "ref"
      });
    }

    loadStock();
  };

  reader.readAsArrayBuffer(file);
}

/* RENDER EXCEL */
function renderExcelPreview(rows) {

  stockTable.innerHTML = "";

  rows.forEach((r, i) => {

    stockTable.innerHTML += `
      <tr>

        <td>
          <input id="ex_name_${i}" value="${r.Name || ""}">
        </td>

        <td>
          <input id="ex_ref_${i}" value="${r.Ref || ""}">
        </td>

        <td>
          <input id="ex_supplier_${i}" value="${r.Supplier || ""}">
        </td>

        <td>
          <input
            id="ex_available_${i}"
            type="number"
            value="${r.Available || 0}"
          >
        </td>

        <td>
          <input
            id="ex_order_${i}"
            type="number"
            value="0"
          >
        </td>

        <td>
          <input id="ex_size_${i}" value="${r.Size || ""}">
        </td>

        <td>

          <button onclick="updatePreviewRow(${i})">
            Update
          </button>

          <button
            onclick="deletePreviewRow(${i})"
            style="background:red;margin-top:5px;"
          >
            Delete
          </button>

        </td>

      </tr>
    `;
  });
}

/* UPDATE PREVIEW */
async function updatePreviewRow(i) {

  const available =
    parseInt(document.getElementById("ex_available_" + i).value) || 0;

  const order =
    parseInt(document.getElementById("ex_order_" + i).value) || 0;

  if (order > available) return alert("Order too high");

  const newVal = available - order;

  document.getElementById("ex_available_" + i).value = newVal;

  excelPreviewData[i].Available = newVal;

  const name = document.getElementById("ex_name_" + i).value;

  const ref = document.getElementById("ex_ref_" + i).value;

  const { data: existing } = await db
    .from("stocks")
    .select("*")
    .eq("ref", ref)
    .maybeSingle();

  if (!existing) {
    return alert("Stock not found in database");
  }

  const qty_before = existing.qty_stock_available;

  const finalQty = qty_before - order;

  if (finalQty < 0) {
    return alert("Not enough stock in database");
  }

  await db.from("stocks")
    .update({
      qty_stock_available: finalQty
    })
    .eq("id", existing.id);

  await db.from("stock_history").insert([{
    stock_id: existing.id,
    name,
    qty_before,
    qty_ordered: order,
    qty_after: finalQty
  }]);

  loadStock();
  loadHistory();
}

/* DELETE PREVIEW */
function deletePreviewRow(i) {

  excelPreviewData.splice(i, 1);

  renderExcelPreview(excelPreviewData);
}

/* SAVE EXCEL */
async function saveExcelToDB() {

  for (let i = 0; i < excelPreviewData.length; i++) {

    const name = document.getElementById("ex_name_"+i).value;

    const ref = document.getElementById("ex_ref_"+i).value;

    const supplier = document.getElementById("ex_supplier_"+i).value;

    const size = document.getElementById("ex_size_"+i).value;

    const available =
      parseInt(document.getElementById("ex_available_"+i).value) || 0;

    if (!name || !ref) continue;

    await db.from("stocks").upsert([{
      name,
      ref,
      supplier,
      size,
      qty_stock_available: available
    }], {
      onConflict: "ref"
    });

    await db.from("stock_history").insert([{
      stock_id: null,
      name,
      qty_before: 0,
      qty_ordered: 0,
      qty_after: available
    }]);
  }

  loadStock();
  loadHistory();

  alert("Saved successfully");
}

function exportMonthlyHistory(){

/* INIT */
window.onload = async () => {
  loginPage.classList.add("active");

  const { data:{ session } } = await db.auth.getSession();

  if (session) {
    loginPage.classList.add("hidden");
    dashboard.classList.remove("hidden");
    dashboard.classList.add("active");
    loadStock();
  }
};

</script>
